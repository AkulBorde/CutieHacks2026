# Deploys the site to Vercel (project "bearcall") on every push to main.
#
# Vercel's GitHub integration can't connect to this repo (it is owned by a
# personal account other than the Vercel project's), so we deploy with the
# Vercel CLI instead. Vercel builds it remotely with the project's own
# settings (Root Directory: frontend) and Production env vars.
#
# Setup (repo admin, once): add a repository secret named VERCEL_TOKEN,
# created at https://vercel.com/account/settings/tokens by the owner of the
# Vercel project. The org and project IDs below are not secrets.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_LWmZjElAjq3bwNq9kzn9oWQz
  VERCEL_PROJECT_ID: prj_2ihLH53ae4y3uhwqazfQc96ZfhcW

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a VERCEL_TOKEN repository secret (see the comment at the top of this file)."
            exit 1
          fi

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@65.12.1 deploy --prod --yes --token="$VERCEL_TOKEN"

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bear Call </title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #18334D;
            background: #90b6db;
        }
    * {
        box-sizing: border-box;
    }
    body {
        margin:0;
        display:grid;
        place-items: center;
        padding: 24px;
        min-height: 100vh;

    }
    main{
        width:100%;
        max-width: 1200px;
        padding: 60px;
        background: white;
        border-radius: 20px;
    }
    h1 {
        margin: 0 0 8px;
        color:#102a43;
        font-size: 42px;
        font-weight: 750;
    }
    .subtitle {
        margin: 0;
        color: #64748b;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
    }
    .intro {
        margin-top: 35px;
    }

    h2 {
        font-size: 32px;
        margin: 0 0 12px;
        line-height: 1.2;
    }
    .description {
        color: #64748b;
        line-height: 1.6;
        max-width: 650px;
    }
    .check-in {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 35px;
        align-items: center;
        margin-top: 30px;
    }
    .qr-section {
        text-align: center;
    }
    .qr-code {
        width: 190px;
        height: 190px;
        object-fit: contain;
    }
    .phone-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    input {
        width: 100%;
        padding: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 15px;
    }
    button {
        padding: 16px;
        background: #18334D;
        color:white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>
<body>

</body>
    <main>
        <header>
            <img src="icon.png" width="150" height="150">
            <h1>Bear Call</h1>
            <p class="subtitle">CAMPUS SAFETY CHECK IN</p>
        </header>
        <p class="description">
            During a campus emergency, Bear Call contacts students to check on their safety and find out who needs assistance.
        </p>
    </section>
    <section class="check-in">
        <div class="qr-section">
            <h3>Scan to connect</h3>
        <img class="qr-code" 
            src="qr-code.png" 
            alt="QR code for Bear Call">
        <p>Access Bear Call check-in page.</p>
        </div>

        <div class="phone-section">
            <label for="phone">Your phone number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number">
            <button type="button">Continue ->

            </button>
        </div>
        </main>
</body>
</html>
